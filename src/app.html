<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/png" href="%sveltekit.assets%/icon.png" />
    <meta name="theme-color" content="#0d1117" />
    <script>
      // Enable scroll-reveal animations. Adding this class before first paint
      // means the reveal CSS hides elements up front (no flash), while no-JS
      // and reduced-motion visitors keep everything visible and un-animated.
      try {
        if (!matchMedia('(prefers-reduced-motion: reduce)').matches) {
          document.documentElement.classList.add('reveal-ready')
        }
      } catch (e) {}
    </script>
    %sveltekit.head%
  </head>
  <body data-sveltekit-preload-data="hover">
    <div style="display: contents">%sveltekit.body%</div>
    <!-- Buy Me a Coffee floating widget (fixed bottom-right bubble). -->
    <script
      data-name="BMC-Widget"
      data-cfasync="false"
      src="https://cdnjs.buymeacoffee.com/1.0.0/widget.prod.min.js"
      data-id="zeejfps"
      data-description="Support me on Buy me a coffee!"
      data-message="Thank you for the coffee"
      data-color="#FF813F"
      data-position="Right"
      data-x_margin="18"
      data-y_margin="18"
    ></script>
  </body>
</html>
